name: Image M3 Production Smoke
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/image-m3-production.yml'
      - 'src/lib/modules/image-compress/**'
      - 'static/models/image-compress/**'
      - 'test/e2e/image-compress-m3.mjs'
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: |
          bun add -d playwright
          bunx playwright install --with-deps chromium
      - name: Fetch open portrait benchmark fixture
        run: |
          mkdir -p test/fixtures/image-compress
          curl --fail --location --retry 3 --max-time 100 \
            --user-agent 'ModuImageBench/3.0 (Open-source QA)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Grace_Hopper.jpg' \
            -o test/fixtures/image-compress/portrait.jpg
      - name: Verify live ROI and local face detection
        env:
          MODU_E2E_URL: https://modu.howlil.site/image/compress
          MODU_E2E_BROWSER: chromium
        run: |
          for attempt in 1 2 3 4 5; do
            echo "M3 production smoke attempt $attempt"
            if curl --fail --silent --location --max-time 20 "$MODU_E2E_URL" >/dev/null &&
              node test/e2e/image-compress-m3.mjs; then
              echo "M3 on-device content-aware production flow verified."
              exit 0
            fi
            sleep 80
          done
          exit 1
