name: Image M2 Production Smoke
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/image-m2-production.yml'
      - 'src/lib/modules/image-compress/**'
      - 'test/e2e/image-compress-m2.mjs'
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: |
          bun add -d playwright
          bunx playwright install --with-deps chromium
      - name: Verify deployed AVIF and MILO in the public site
        env:
          MODU_E2E_URL: https://modu.howlil.site/image/compress
          MODU_E2E_BROWSER: chromium
        run: |
          for attempt in 1 2 3 4 5; do
            echo "M2 production smoke attempt $attempt"
            if curl --fail --location --silent --show-error --max-time 20 "$MODU_E2E_URL" >/dev/null &&
               node test/e2e/image-compress-m2.mjs; then
              echo "Deployed AVIF and MILO quality path verified."
              exit 0
            fi
            sleep 75
          done
          echo "Production image M2 smoke failed: check Cloudflare Workers deployment."
          exit 1
