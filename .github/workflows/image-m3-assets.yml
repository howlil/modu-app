name: Vendor M3 on-device face detector assets
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/image-m3-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install and lock MediaPipe
        run: bun install
      - name: Download official licensed face model and local WASM
        run: |
          set -euo pipefail
          mkdir -p static/models/image-compress/wasm
          curl -fL --retry 3 --max-time 120 \
            'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' \
            -o static/models/image-compress/blaze_face_short_range.tflite
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_internal.js static/models/image-compress/wasm/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_internal.wasm static/models/image-compress/wasm/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.js static/models/image-compress/wasm/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.wasm static/models/image-compress/wasm/
          test "$(wc -c < static/models/image-compress/blaze_face_short_range.tflite)" -gt 100000
          sha256sum static/models/image-compress/blaze_face_short_range.tflite
      - name: Commit pinned face inference assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock static/models/image-compress/
          if git diff --cached --quiet; then echo "No asset changes"; exit 0; fi
          git commit -m "build(image-m3): vendor self-hosted face model and MediaPipe WASM"
          git pull --rebase origin master
          git push origin HEAD:master
