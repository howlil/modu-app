name: Daily Production Smoke

on:
  workflow_dispatch:

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Install temporary browser test tooling
        run: |
          bun add -d playwright
          bunx playwright install --with-deps chromium
      - name: Confirm production Daily is reachable
        env:
          MODU_DAILY_E2E_URL: https://modu.howlil.site/daily
        run: curl --fail --location --silent --show-error --max-time 20 "$MODU_DAILY_E2E_URL" > /dev/null
      - name: Run isolated production-browser Daily journeys
        env:
          MODU_DAILY_E2E_URL: https://modu.howlil.site/daily
        run: node test/e2e/daily.mjs
      - name: Archive production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-production-smoke
          path: test-results/daily/
          retention-days: 7
          if-no-files-found: ignore
