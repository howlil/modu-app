name: Image M3 ROI and Face Model E2E
on:
  push:
    branches: [master]
    paths:
      - 'src/lib/modules/image-compress/**'
      - 'static/models/image-compress/**'
      - 'test/e2e/image-compress-m3.mjs'
      - '.github/workflows/image-m3-e2e.yml'
      - 'bun.lock'
  workflow_dispatch:
jobs:
  m3-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - run: bun install --frozen-lockfile
      - name: Install browser harness
        run: |
          bun add -d playwright
          bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run build
      - name: Start production-like worker
        run: |
          bunx wrangler dev --port 8787 > /tmp/modu-m3.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8787/image/compress >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/modu-m3.log
          exit 1
      - name: Verify face assets, ROI scoring and keyboard/mobile UX
        env:
          MODU_E2E_BROWSER: ${{ matrix.browser }}
        run: node test/e2e/image-compress-m3.mjs
      - name: Dump browser worker logs on failure
        if: failure()
        run: tail -100 /tmp/modu-m3.log || true
