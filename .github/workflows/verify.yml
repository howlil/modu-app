name: Verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install dependencies
        run: bun install
      - name: Bootstrap text lockfile for reproducibility
        run: |
          if [ -f bun.lock ]; then
            echo 'BEGIN_BUN_LOCK_BASE64'
            base64 -w0 bun.lock
            echo
            echo 'END_BUN_LOCK_BASE64'
          fi
      - name: Typecheck
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build Cloudflare bundle
        run: bun run build
