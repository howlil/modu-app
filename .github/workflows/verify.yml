name: Verify

on:
  push:
    branches: [master, feat/image-adaptive-m1]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install dependencies and generate lock
        run: |
          bun install
          echo 'MODU_LOCK_BEGIN'
          cat bun.lock
          echo 'MODU_LOCK_END'
      - name: Typecheck
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build Cloudflare bundle
        run: bun run build
