name: Verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build Cloudflare bundle
        run: bun run build
      - name: Validate SQLite Durable Object Worker bundle
        run: bunx wrangler deploy --config wrangler.sync.jsonc --dry-run --outdir .wrangler/dry-run-modu-sync
      - name: Cloudflare workerd SQLite runtime integration
        run: node test/integration/sync-worker-runtime.mjs
      - name: Set up real Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      - name: Habit Tracker browser E2E
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: node test/e2e/habit-tracker-browser.mjs
      - name: Global Data & Sync browser E2E
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: node test/e2e/global-data-browser.mjs
      - name: Career Evidence browser E2E
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: node test/e2e/career-evidence-browser.mjs

