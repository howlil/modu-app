name: Image M2 AVIF Perceptual E2E
on:
  push:
    branches: [master]
    paths:
      - 'src/lib/modules/image-compress/**'
      - 'test/e2e/image-compress-m2.mjs'
      - '.github/workflows/image-m2-e2e.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:
jobs:
  m2-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install app
        run: bun install --frozen-lockfile
      - name: Install browser harness
        run: |
          bun add -d playwright
          bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Build Cloudflare production bundle
        run: bun run build
      - name: Start production preview
        run: |
          bunx wrangler dev --port 8787 > /tmp/modu-m2-e2e.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fs http://127.0.0.1:8787/image/compress >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/modu-m2-e2e.log
          exit 1
      - name: Test AVIF and MILO optimization
        env:
          MODU_E2E_BROWSER: ${{ matrix.browser }}
        run: node test/e2e/image-compress-m2.mjs
      - name: Inspect worker logs on failure
        if: failure()
        run: tail -120 /tmp/modu-m2-e2e.log || true
