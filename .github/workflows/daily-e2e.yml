name: Daily Browser E2E

on:
  push:
    branches: [master]
    paths:
      - 'src/lib/modules/daily-execution/**'
      - 'src/lib/shared/focus-sessions/**'
      - 'src/lib/modules/pomodoro/**'
      - 'test/e2e/daily.mjs'
      - '.github/workflows/daily-e2e.yml'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
  pull_request:
    paths:
      - 'src/lib/modules/daily-execution/**'
      - 'src/lib/shared/focus-sessions/**'
      - 'src/lib/modules/pomodoro/**'
      - 'test/e2e/daily.mjs'
      - '.github/workflows/daily-e2e.yml'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
  workflow_dispatch:

jobs:
  daily-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Install ephemeral Playwright browser
        run: |
          bun add -d playwright
          bunx playwright install --with-deps chromium
      - name: Build Cloudflare production bundle
        run: bun run build
      - name: Start production-like Cloudflare Worker
        run: |
          bunx wrangler dev --port 8787 > /tmp/modu-daily-e2e-wrangler.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8787/daily > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/modu-daily-e2e-wrangler.log
          exit 1
      - name: Verify Daily user journeys and responsive layouts
        run: node test/e2e/daily.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-browser-screenshots
          path: test-results/daily/
          if-no-files-found: ignore
          retention-days: 7
      - name: Wrangler logs on failure
        if: failure()
        run: tail -100 /tmp/modu-daily-e2e-wrangler.log || true
